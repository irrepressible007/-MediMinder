name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keys
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/old.jks
          echo "${{ secrets.NEW_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/new.jks
          echo "${{ secrets.SIGNING_LINEAGE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/lineage.bin

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/old.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          
      # Android key rotation: the old key (Android 7-8, and the anchor) hands over to the new one
      - name: Sign with key rotation
        run: python3 tools/sign_release.py app/build/outputs/apk/release/app-release.apk
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/old.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NEW_KEYSTORE_PATH: ${{ runner.temp }}/new.jks
          NEW_KEYSTORE_PASSWORD: ${{ secrets.NEW_KEYSTORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.NEW_KEY_ALIAS }}
          SIGNING_LINEAGE_PATH: ${{ runner.temp }}/lineage.bin

      # The app's updater reads update.json through github.com's download links (no API, so no
      # per-address limit): a higher versionCode means "newer"; the APK is checked against this
      # size and SHA-256 before it is installed; the notes come from the tag's message.
      - name: Describe the update
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release_notes.md
          python3 - <<'PY'
          import hashlib, json, os, re
          gradle = open("app/build.gradle.kts", encoding="utf-8").read()
          apk = "app/build/outputs/apk/release/app-release.apk"
          data = open(apk, "rb").read()
          tag = os.environ["GITHUB_REF_NAME"]
          json.dump({
              "versionCode": int(re.search(r"versionCode = (\d+)", gradle).group(1)),
              "versionName": re.search(r'versionName = "([^"]+)"', gradle).group(1),
              "sha256": hashlib.sha256(data).hexdigest(),
              "size": len(data),
              "apk": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/app-release.apk",
              "notes": [l.strip() for l in open("release_notes.md", encoding="utf-8") if l.strip()],
          }, open("update.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          cat update.json release_notes.md

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
          name: MediMinder ${{ github.ref_name }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

