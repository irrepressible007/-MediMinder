name: Tests

# Every push and pull request: the unit, database, reminder and UI tests, then Android Lint.
# (Releases are built separately, by release.yml, when a version tag is pushed.)
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit and UI tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Run on its own: lint and the tests together have been flaky on this project
      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
